<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABG & Anion Gap 臨床綜合判讀計算器</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 12px; 
            margin: 0;
        }
        .container { 
            max-width: 500px; 
            margin: 0 auto; 
            background: var(--card); 
            padding: 20px 16px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
        }
        h2 { 
            margin-top: 0; 
            color: #0f172a; 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 10px; 
            font-size: 1.3rem;
            text-align: center;
        }
        .part-header { 
            background: #e0f2fe; 
            color: #0369a1; 
            padding: 10px 12px; 
            font-weight: bold; 
            font-size: 0.95rem;
            border-radius: 6px; 
            margin: 20px 0 14px 0; 
            border-left: 4px solid #0284c7; 
        }
        /* 改為單欄直列式 (Flex Direction: Column) */
        .grid-single { 
            display: flex;
            flex-direction: column;
            gap: 14px; 
        }
        .group { 
            display: flex; 
            flex-direction: column; 
        }
        label { 
            font-size: 0.95rem; 
            font-weight: 600; 
            margin-bottom: 6px; 
            color: #334155; 
        }
        /* 加大輸入框與選單，方便手機觸控點擊 */
        input, select { 
            padding: 12px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 1rem; 
            box-sizing: border-box;
            width: 100%;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        .auto-calculated { 
            background-color: #f0fdf4; 
            border-color: #86efac; 
            color: #166534; 
            font-weight: bold; 
        }
        .hint { 
            font-size: 0.8rem; 
            color: #64748b; 
            margin-top: 4px; 
        }
        button { 
            width: 100%; 
            margin-top: 24px; 
            padding: 14px; 
            background: var(--primary); 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.05rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        button:hover { 
            background: #1d4ed8; 
        }
        .result { 
            margin-top: 24px; 
            padding: 16px; 
            background: #f1f5f9; 
            border-left: 4px solid var(--primary); 
            border-radius: 8px; 
            display: none; 
        }
        .result-title { 
            font-weight: bold; 
            color: #0f172a; 
            font-size: 1.1rem; 
            margin-bottom: 8px; 
        }
        .highlight { 
            color: #0369a1; 
            font-weight: bold; 
            margin-bottom: 8px; 
            font-size: 1rem;
        }
        .section-box { 
            margin-top: 10px; 
            padding-top: 8px; 
            border-top: 1px solid #cbd5e1; 
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ABG & Anion Gap 臨床綜合判讀計算器</h2>
    <form id="abgForm">
        
        <!-- PART 1: ABG & Oxygenation -->
        <div class="part-header">Part 1: ABG 數據與重症氧合分析（必填項目）</div>
        <div class="grid-single">
            <div class="group">
                <label for="ph">pH 值 *</label>
                <input type="number" id="ph" step="0.01" placeholder="例: 7.31" required>
            </div>
            <div class="group">
                <label for="paco2">PaCO2 (mmHg) *</label>
                <input type="number" id="paco2" step="0.1" placeholder="例: 30" required>
            </div>
            <div class="group">
                <label for="hco3">HCO3- (mEq/L) *</label>
                <input type="number" id="hco3" step="0.1" placeholder="例: 15" required>
            </div>
            <div class="group">
                <label for="isChronic">呼吸性失衡型態</label>
                <select id="isChronic">
                    <option value="false">急性 (Acute)</option>
                    <option value="true">慢性 (Chronic)</option>
                </select>
            </div>
            <div class="group">
                <label for="pao2">PaO2 (mmHg)</label>
                <input type="number" id="pao2" step="0.1" placeholder="例: 80">
            </div>
            <div class="group">
                <label for="fio2">FiO2 (21-100% 或 0.21-1)</label>
                <input type="number" id="fio2" step="0.01" placeholder="例: 50 或 0.5">
            </div>
            <div class="group">
                <label for="peep">PEEP (cmH2O)</label>
                <input type="number" id="peep" step="0.1" placeholder="例: 8">
            </div>
        </div>

        <!-- PART 2: Anion Gap & Electrolytes -->
        <div class="part-header">Part 2: Anion Gap 陰離子隙與電解質分析（選填項目）</div>
        <div class="grid-single">
            <div class="group">
                <label for="ag">Anion Gap (mEq/L)</label>
                <input type="number" id="ag" step="0.1" placeholder="輸入下方電解質將自動計算帶入">
                <span class="hint" id="agHint">可直接手動輸入，或填寫下方電解質自動計算</span>
            </div>
            <div class="group">
                <label for="na">Na+ (mEq/L)</label>
                <input type="number" id="na" step="0.1" placeholder="例: 145">
            </div>
            <div class="group">
                <label for="cl">Cl- (mEq/L)</label>
                <input type="number" id="cl" step="0.1" placeholder="例: 110">
            </div>
            <div class="group">
                <label for="albumin">Serum Albumin (g/dL)</label>
                <input type="number" id="albumin" step="0.1" placeholder="例: 3.0 (校正 AG 用)">
                <span class="hint">預設基準為 4.0 g/dL</span>
            </div>
        </div>

        <button type="button" onclick="calculateABG()">進行綜合判讀與生理算式分析</button>
    </form>

    <div id="resultBox" class="result">
        <div class="result-title">判讀結果 Summary</div>
        <div id="resultSummary" class="highlight"></div>
        <div id="resultDetails"></div>
    </div>
</div>

<script>
// 自動計算並回填 Anion Gap
function autoCalculateAG() {
    const na = parseFloat(document.getElementById('na').value);
    const cl = parseFloat(document.getElementById('cl').value);
    const hco3 = parseFloat(document.getElementById('hco3').value);
    const albumin = parseFloat(document.getElementById('albumin').value);
    const agInput = document.getElementById('ag');

    if (!isNaN(na) && !isNaN(cl) && !isNaN(hco3)) {
        let rawAG = na - (cl + hco3);
        let finalAG = rawAG;

        if (!isNaN(albumin)) {
            finalAG = rawAG + 2.5 * (4.0 - albumin);
            document.getElementById('agHint').innerText = `已自動依 Albumin ${albumin} g/dL 校正計算`;
        } else {
            document.getElementById('agHint').innerText = `已自動依 Na - (Cl + HCO3) 帶入計算`;
        }

        agInput.value = finalAG.toFixed(1);
        agInput.classList.add('auto-calculated');
    }
}

// 監聽電解質與 HCO3- 輸入事件
['na', 'cl', 'albumin', 'hco3'].forEach(id => {
    document.getElementById(id).addEventListener('input', autoCalculateAG);
});

// 使用者若手動修改 AG 輸入框，清除自動醒目提示
document.getElementById('ag').addEventListener('input', function() {
    this.classList.remove('auto-calculated');
    document.getElementById('agHint').innerText = '手動修改模式';
});

function calculateABG() {
    const ph = parseFloat(document.getElementById('ph').value);
    const paco2 = parseFloat(document.getElementById('paco2').value);
    const hco3 = parseFloat(document.getElementById('hco3').value);
    const pao2 = parseFloat(document.getElementById('pao2').value);
    let fio2 = parseFloat(document.getElementById('fio2').value);
    const peep = parseFloat(document.getElementById('peep').value);
    const isChronic = document.getElementById('isChronic').value === 'true';

    let ag = parseFloat(document.getElementById('ag').value);
    const na = parseFloat(document.getElementById('na').value);
    const cl = parseFloat(document.getElementById('cl').value);
    const albumin = parseFloat(document.getElementById('albumin').value);

    if (isNaN(ph) || isNaN(paco2) || isNaN(hco3)) {
        alert("請至少輸入 Part 1 的 pH、PaCO2 與 HCO3- 數值！");
        return;
    }

    // 酸鹼狀態分析
    let status = ph < 7.35 ? "Acidemia (酸血症)" : (ph > 7.45 ? "Alkalemia (鹼血症)" : "Normal pH / Mixed Disorder");
    let primary = [];
    const isRespAcid = paco2 > 45, isRespAlk = paco2 < 35, isMetAcid = hco3 < 22, isMetAlk = hco3 > 26;

    if (isRespAcid) primary.push("Respiratory Acidosis");
    else if (isRespAlk) primary.push("Respiratory Alkalosis");
    if (isMetAcid) primary.push("Metabolic Acidosis");
    else if (isMetAlk) primary.push("Metabolic Alkalosis");

    // 生理代償預測
    let compNotes = [];
    if (isMetAcid) {
        const expCO2 = (1.5 * hco3) + 8;
        if (paco2 < expCO2 - 2) compNotes.push(`Winter's Formula 預估 PaCO2: <strong>${expCO2.toFixed(1)}±2 mmHg</strong> -> 併發呼吸性鹼中毒`);
        else if (paco2 > expCO2 + 2) compNotes.push(`Winter's Formula 預估 PaCO2: <strong>${expCO2.toFixed(1)}±2 mmHg</strong> -> 併發呼吸性酸中毒`);
        else compNotes.push(`Winter's Formula 預估 PaCO2: <strong>${expCO2.toFixed(1)}±2 mmHg</strong> -> 適當代償`);
    }

    if (isMetAlk) {
        const expCO2 = 0.7 * (hco3 - 24) + 40;
        if (paco2 > expCO2 + 5) compNotes.push(`代鹼預估 PaCO2: <strong>${expCO2.toFixed(1)}±5 mmHg</strong> -> 併發呼吸性酸中毒`);
        else if (paco2 < expCO2 - 5) compNotes.push(`代鹼預估 PaCO2: <strong>${expCO2.toFixed(1)}±5 mmHg</strong> -> 併發呼吸性鹼中毒`);
        else compNotes.push(`代鹼預估 PaCO2: <strong>${expCO2.toFixed(1)}±5 mmHg</strong> -> 適當代償`);
    }

    if (isRespAcid) {
        const deltaCO2 = paco2 - 40;
        const expHCO3 = isChronic ? 24 + (deltaCO2 / 10 * 3.5) : 24 + (deltaCO2 / 10 * 1);
        compNotes.push(`呼吸性酸中毒 (${isChronic ? '慢性' : '急性'}) 預估 HCO3-: <strong>${expHCO3.toFixed(1)} mEq/L</strong>`);
    } else if (isRespAlk) {
        const deltaCO2 = 40 - paco2;
        const expHCO3 = isChronic ? 24 - (deltaCO2 / 10 * 5) : 24 - (deltaCO2 / 10 * 2);
        compNotes.push(`呼吸性鹼中毒 (${isChronic ? '慢性' : '急性'}) 預估 HCO3-: <strong>${expHCO3.toFixed(1)} mEq/L</strong>`);
    }

    // 氧合分析
    let pfSummary = "";
    if (!isNaN(pao2) && !isNaN(fio2)) {
        if (fio2 > 1.0) fio2 /= 100.0;
        const pf = (pao2 / fio2).toFixed(1);
        const peepOk = isNaN(peep) || peep >= 5;
        let ards = pf > 300 ? "Normal P/F Ratio" : (pf > 200 ? (peepOk ? "Mild ARDS" : "Mild Impairment") : (pf > 100 ? (peepOk ? "Moderate ARDS" : "Moderate Impairment") : (peepOk ? "Severe ARDS" : "Severe Impairment")));
        pfSummary = `P/F Ratio: <strong>${pf} mmHg</strong> (${ards})`;
    }

    // Anion Gap 診斷
    let agDiagnosisText = "";
    if (!isNaN(ag)) {
        if (ag > 12) {
            agDiagnosisText = `Anion Gap 判讀: <strong style="color:#c2410c;">High Anion Gap (${ag.toFixed(1)} mEq/L)</strong><br>` +
                              `<span style="font-size:0.85rem; color:#475569;">病因考量 (GOLD MARK / MUDPILES): Glycols, Oxoproline, L-Lactate, D-Lactate, Methanol, Aspirin, Renal Failure, Ketoacidosis</span>`;
        } else if (ag < 8) {
            agDiagnosisText = `Anion Gap 判讀: <strong style="color:#0369a1;">Low Anion Gap (${ag.toFixed(1)} mEq/L)</strong><br>` +
                              `<span style="font-size:0.85rem; color:#475569;">病因考量: Hypoalbuminemia, Multiple Myeloma (IgG), Lithium toxicity, Severe Hypercalcemia</span>`;
        } else {
            agDiagnosisText = `Anion Gap 判讀: <strong>Normal Anion Gap (${ag.toFixed(1)} mEq/L)</strong><br>` +
                              `<span style="font-size:0.85rem; color:#475569;">病因考量 (HARDUPS): Diarrhea, RTA, Acetazolamide, Saline infusion</span>`;
        }
    }

    // Delta Ratio
    let deltaText = "";
    if (!isNaN(ag) && ag > 12 && isMetAcid) {
        const deltaAG = ag - 12;
        const deltaHCO3 = 24 - hco3;
        if (deltaHCO3 > 0) {
            const ratio = (deltaAG / deltaHCO3).toFixed(2);
            let interp = ratio < 0.4 ? "Hyperchloremic / Normal AG Metabolic Acidosis" : (ratio <= 2.0 ? "Pure High AG Metabolic Acidosis" : "High AG Met Acidosis + Concomitant Metabolic Alkalosis");
            deltaText = `Delta Ratio (ΔAG/ΔHCO3) = <strong>${ratio}</strong> (${interp})`;
        }
    }

    document.getElementById('resultSummary').innerText = `${status} | ${primary.join(' + ') || '無明顯主疾病'}`;
    
    let html = "";
    if (compNotes.length > 0) html += `<div class="section-box"><p><strong>代償預測公式:</strong><br>${compNotes.join('<br>')}</p></div>`;
    if (pfSummary) html += `<div class="section-box"><p><strong>重症氧合評估:</strong><br>${pfSummary}</p></div>`;
    if (agDiagnosisText) {
        html += `<div class="section-box"><p><strong>Anion Gap 數值與判讀:</strong><br>${agDiagnosisText}</p>`;
        if (deltaText) html += `<p><strong>Delta Ratio 分析:</strong><br>${deltaText}</p>`;
        html += `</div>`;
    }

    document.getElementById('resultDetails').innerHTML = html;
    document.getElementById('resultBox').style.display = 'block';
}
</script>

</body>
</html>
